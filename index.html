    <script>
        // DOM Elements
        const screen1 = document.getElementById('screen-1');
        const screen2 = document.getElementById('screen-2');
        const screen3 = document.getElementById('screen-3');
        const btnNext = document.getElementById('btn-next');
        
        // Modal logic
        const modal = document.getElementById('zoom-modal');
        const zoomImage = document.getElementById('zoom-image');
        const polaroids = document.querySelectorAll('.polaroid-card');

        // Navigation: Screen 1 to Screen 2
        btnNext.addEventListener('click', () => {
            screen1.classList.remove('opacity-100');
            screen1.classList.add('opacity-0');
            
            setTimeout(() => {
                screen1.classList.add('hidden');
                screen1.classList.remove('flex');
                
                screen2.classList.remove('hidden');
                screen2.classList.add('flex');
                
                setTimeout(() => {
                    screen2.classList.remove('opacity-0');
                    screen2.classList.add('opacity-100');
                }, 50);
            }, 600);
        });

        // Initialize Zoom Interactions
        polaroids.forEach(card => {
            card.addEventListener('click', () => {
                const imgSrc = card.querySelector('img').src;
                zoomImage.src = imgSrc;
                
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modal.classList.add('opacity-100');
                }, 10);
            });
        });

        modal.addEventListener('click', () => {
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                zoomImage.src = '';
            }, 600);
        });

        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        
        const noTexts = [
            "Think again", "Nice try!", "Too slow!", 
            "Catch me", "Nope", "Still no", 
            "Almost", "Try Yes instead"
        ];
        
        let clickCount = 0;
        let yesScale = 1;
        let isFirstClick = true;

        function moveNoButton() {
            if (isFirstClick) {
                // Change to fixed positioning so it can traverse the whole screen safely
                const rect = btnNo.getBoundingClientRect();
                btnNo.style.position = 'fixed';
                btnNo.style.left = `${rect.left}px`;
                btnNo.style.top = `${rect.top}px`;
                isFirstClick = false;
            }

            clickCount++;
            btnNo.innerText = noTexts[(clickCount - 1) % noTexts.length];
            
            // Grow Yes button
            if (yesScale < 8) {
                yesScale += 0.35;
                btnYes.style.transform = `scale(${yesScale})`;
            }
            
            if (clickCount === 2) {
                btnYes.classList.add('shadow-lg');
                btnYes.style.fontSize = '18px';
            }

            // Calculate constraints so button stays entirely visible on screen
            const safePadding = 20;
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;
            
            const maxX = window.innerWidth - btnWidth - safePadding;
            const maxY = window.innerHeight - btnHeight - safePadding;

            const randomX = Math.max(safePadding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(safePadding, Math.floor(Math.random() * maxY));

            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
        }

        btnNo.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        function fireConfetti() {
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // Shoot from left edge
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                }));
                // Shoot from right edge
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                }));
            }, 250);
        }

        // Navigation: Screen 2 to Screen 3
        btnYes.addEventListener('click', () => {
            btnNo.style.display = 'none'; // Ensure the runaway button vanishes
            
            screen2.classList.remove('opacity-100');
            screen2.classList.add('opacity-0');
            
            setTimeout(() => {
                screen2.classList.add('hidden');
                screen2.classList.remove('flex');
                
                screen3.classList.remove('hidden');
                screen3.classList.add('flex');
                
                setTimeout(() => {
                    screen3.classList.remove('opacity-0');
                    screen3.classList.add('opacity-100');
                    
                    // Trigger the fireworks!
                    fireConfetti();
                }, 50);
            }, 600);
        });

    </script>
</body>
</html>
